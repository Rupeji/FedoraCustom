name = "fedora-minimo"
description = "Instalacion minima configurada de Fedora 45 Tradicional"
version = "1.0.4"
modules = []
groups = []

# --- REPOSITORIOS ADICIONALES (Para Nvidia y Firmwares propietarios) ---
[[repository]]
id = "rpmfusion-nonfree"
name = "RPM Fusion for Fedora 45 - Nonfree"
baseurl = "https://rpmfusion.org"
enabled = true
gpgcheck = true

[[repository]]
id = "rpmfusion-nonfree-updates"
name = "RPM Fusion for Fedora 45 - Nonfree - Updates"
baseurl = "https://rpmfusion.org"
enabled = true
gpgcheck = true


# --- PAQUETES DE HARDWARE ESENCIALES ---

# Microcódigo para tu procesador AMD Ryzen 5800X (Estabilidad del sistema)
[[packages]]
name = "amd-ucode-firmware"
version = "*"

# Firmware general de red (Wi-Fi/Bluetooth) y periféricos
[[packages]]
name = "linux-firmware"
version = "*"

# CONTROLADORES OFICIALES NVIDIA (Para tu RTX 3070 Ti)
[[packages]]
name = "akmod-nvidia"
version = "*"

# Soporte de aceleración de video por hardware (Cuda/NVDEC) para Nvidia
[[packages]]
name = "xorg-x11-drv-nvidia-cuda"
version = "*"


# --- HERRAMIENTAS ESENCIALES DE ANTES ---
[[packages]]
name = "micro"
version = "*"

[[packages]]
name = "htop"
version = "*"


# --- CONFIGURACIONES DEL SISTEMA ---
[customizations.locale]
languages = ["es_ES.UTF-8"]
keyboard = "es"

[customizations.timezone]
timezone = "Europe/Madrid"

[customizations]
hostname = "fedora"

[[customizations.user]]
name = "inhumano"
description = "Usuario Principal"
password = "$6$rounds=656000$p4O6G2d8t.W5JpBv$nQpT3BwunZ7hK6/t6G708E77pEexS8R9DOnkXw0ZJbFm4f8V.XW3pPWh7XvR9Qy4sLWh7Yf2vWR7vYf2vWR7v."
