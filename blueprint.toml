name = "fedora-minimo"
description = "Instalacion minima configurada de Fedora 45 Tradicional"
version = "1.0.5"
modules = []
groups = []

# --- PAQUETES DE HARDWARE ESENCIALES (Paso 1) ---
[[packages]]
name = "amd-ucode-firmware"
version = "*"

[[packages]]
name = "linux-firmware"
version = "*"

[[packages]]
name = "akmod-nvidia"
version = "*"

[[packages]]
name = "xorg-x11-drv-nvidia-cuda"
version = "*"


# --- PASO 2: ENTORNO GRÁFICO PERSONALIZADO (KINETICWE) ---
[[packages]]
name = "kineticwe"
version = "*"

[[packages]]
name = "kineticwe-greeter"
version = "*"

[[packages]]
name = "greetd"
version = "*"


# --- PASO 3: CONECTIVIDAD Y AUDIO ---
[[packages]]
name = "pipewire"
version = "*"

[[packages]]
name = "pipewire-utils"
version = "*"

[[packages]]
name = "wireplumber"
version = "*"

[[packages]]
name = "NetworkManager-wifi"
version = "*"

# --- PASO 4: GESTIÓN DE SOFTWARE Y FORMATOS ---
[[packages]]
name = "flatpak"
version = "*"

[[packages]]
name = "gstreamer1-plugins-bad-free"
version = "*"

[[packages]]
name = "gstreamer1-plugins-good"
version = "*"

[[packages]]
name = "gstreamer1-plugins-ugly-free"
version = "*"

# --- PASO 5: TERMINAL AVANZADA Y CONFORT ---
[[packages]]
name = "kitty"
version = "*"

[[packages]]
name = "fish"
version = "*"

[[packages]]
name = "starship"
version = "*"

[[packages]]
name = "jetbrains-mono-fonts"
version = "*"

# --- HERRAMIENTAS ESENCIALES DE ANTES ---
