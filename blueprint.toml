name = "fedora-minimo"
description = "Instalacion minima configurada de Fedora 45 Tradicional"
version = "1.0.1"
modules = []
groups = []

# HERRAMIENTAS ESENCIALES
[[packages]]
name = "micro"
version = "*"

[[packages]]
name = "htop"
version = "*"

# 1. IDIOMA Y TECLADO
[customizations.locale]
languages = ["es_ES.UTF-8"] # Sistema en español
keyboard = "es"             # Distribución de teclado en español

# 2. ZONA HORARIA
[customizations.timezone]
timezone = "Europe/Madrid"  # Configura tu hora local automática

# 3. NOMBRE DEL EQUIPO (Hostname)
[customizations.hostname]
hostname = "fedora"

# 4. CONFIGURACIÓN DEL USUARIO (Con contraseña segura)
[[customizations.user]]
name = "inhumano"
description = "Usuario Principal"
# Esta contraseña en texto plano es: Fedora2026. (¡Cámbiala luego!)
password = "Pacopicopoco.7"
groups = ["wheel"] # Permisos de administrador (sudo)
